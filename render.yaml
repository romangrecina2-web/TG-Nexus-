services:
  - type: web
    name: tg-shell-bot-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEB_APP_URL
        value: https://romangrecina2-web.github.io/TG-test-/
      - key: ALLOWED_ORIGINS
        value: https://romangrecina2-web.github.io
      - key: DATABASE_URL
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
