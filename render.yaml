# Free Postgres is for testing only: it expires 30 days after creation.
# Export data or move to a paid/other persistent database before expiry.
databases:
  - name: tg-nexus-postgres
    databaseName: tgnexus
    user: tgnexus
    plan: free
    region: frankfurt

services:
  - type: web
    name: tg-shell-bot-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEB_APP_URL
        value: https://romangrecina2-web.github.io/TG-test-/
      - key: ALLOWED_ORIGINS
        value: https://romangrecina2-web.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: tg-nexus-postgres
          property: connectionString
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
