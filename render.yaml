services:
  - type: web
    name: tg-shell-bot-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PRO_BILLING_ENABLED
        value: "false"
      - key: PRO_PRICE_7_DAYS
        value: "70"
      - key: PRO_PRICE_14_DAYS
        value: "110"
      - key: PRO_PRICE_21_DAYS
        value: "150"
      - key: PRO_PRICE_31_DAYS
        value: "199"
      - key: BOT_ADMIN_IDS
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: WEB_APP_URL
        value: https://romangrecina2-web.github.io/TG-Nexus-/
      - key: ALLOWED_ORIGINS
        value: https://romangrecina2-web.github.io
      - key: AI_API_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_DEFAULT_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: BOT_DATA_ENCRYPTION_KEY
        generateValue: true
      - key: DATA_DIR
        value: ./data
      - key: UPDATE_WORKER_CONCURRENCY
        value: "3"
      - key: UPDATE_MAX_ATTEMPTS
        value: "8"
