services:
  - type: web
    name: tg-shell-bot-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEB_APP_URL
        value: https://romangrecina2-web.github.io/TG-test-/
      - key: ALLOWED_ORIGINS
        value: https://romangrecina2-web.github.io
      - key: AI_API_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_DEFAULT_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: BOT_DATA_ENCRYPTION_KEY
        generateValue: true
      - key: DATA_DIR
        value: ./data
