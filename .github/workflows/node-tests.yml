name: Node tests

on:
  pull_request:
  push:
    branches:
      - main
      - feature/telegram-ai-github-integration
      - fix/bot-storage-diagnostics-2026-11-19

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
