name: Security checks

on:
  push:
    branches: [main, "security/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        run: |
          node --check server.js
          node --check bot-chat.js
          node --check app.js
          node --check sandbox.js
      - name: Unit tests
        run: npm test
